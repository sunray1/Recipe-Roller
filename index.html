<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookbook Randomizer</title>
  <meta name="description" content="Pick a random cookbook and a valid random page from a Google Sheet.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">WHAT SHOULD I COOK?</p>
    <h1>Cookbook Randomizer</h1>
    <p class="intro">Pick a cookbook at random, then let fate choose the page.</p>

    <section class="result" aria-live="polite" aria-atomic="true">
      <div class="label">COOKBOOK</div>
      <div id="book" class="book">Loading cookbooks…</div>
      <div class="divider"></div>
      <div class="label">PAGE</div>
      <div id="page" class="page">—</div>
    </section>

    <div class="actions">
      <button id="rerollBook" type="button" disabled>Reroll Book + Page</button>
      <button id="rerollPage" class="secondary" type="button" disabled>Reroll Page</button>
    </div>

    <p id="status" class="status">Reading your Google Sheet…</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
